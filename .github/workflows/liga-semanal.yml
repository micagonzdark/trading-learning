name: Liga Semanal de Trading

on:
  schedule:
    # Todos los viernes a las 23:00 UTC
    - cron: '0 23 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar-liga:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Ejecutar script semanal de la liga
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: npx tsx scripts/liga.ts

      - name: Commit y push de cambios en data/
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No se detectaron cambios en data/. Nada para commitear."
          else
            git commit -m "chore(liga): actualizacion semanal automatica de cartera y precios [skip ci]"
            git push
          fi
